{% extends 'layout.html' %}{% block title %}طلب فحص كاميرات{% endblock %}{% block content %}<div class="card"><h1>طلب فحص كاميرات 2026</h1><p class="muted">تحويل النموذج الورقي إلى طلب إلكتروني.</p><form method="post"><div class="form-grid"><div><label>التاريخ</label><input type="date" name="request_date" value="{{data.get('request_date','')}}" required></div><div><label>الاسم</label><input name="requester_name" value="{{data.get('requester_name','')}}" required></div><div><label>رقم الوحدة</label><input name="unit_no" value="{{data.get('unit_no','')}}"></div><div><label>الصفة</label><input name="affiliation" value="{{data.get('affiliation','')}}"></div><div><label>رقم الموبايل</label><input name="mobile" value="{{data.get('mobile','')}}"></div><div><label>التوقيت</label><input type="time" name="event_time" value="{{data.get('event_time','')}}"></div><div class="full"><label>بيان الحدث</label><textarea name="event_description" required>{{data.get('event_description','')}}</textarea></div><div><label>مكان الحدث</label><input name="event_location" value="{{data.get('event_location','')}}"></div><div><label>المواصفات</label><textarea name="specifications">{{data.get('specifications','')}}</textarea></div></div><div class="actions"><button class="btn">إرسال طلب الفحص</button><a class="btn secondary" href="/dashboard">إلغاء</a></div></form></div>{% endblock %}
