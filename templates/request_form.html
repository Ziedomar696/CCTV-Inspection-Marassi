{% extends "layout.html" %}{% block title %}طلب فحص كاميرات{% endblock %}{% block content %}
<div class="card"><h1>طلب فحص كاميرات 2026</h1><p class="muted">النموذج الإلكتروني المطور عن الطلب الورقي.</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><div class="grid2">
<div class="field"><label>التاريخ</label><input type="date" name="request_date" value="{{data.get('request_date','')}}" required></div>
<div class="field"><label>الاسم</label><input name="requester_name" value="{{data.get('requester_name','')}}" required></div>
<div class="field"><label>رقم الوحدة</label><input name="unit_no" value="{{data.get('unit_no','')}}" placeholder="اختياري"></div>
<div class="field"><label>تبعية الموظف / الشركة</label><input name="employee_affiliation" value="{{data.get('employee_affiliation','')}}" placeholder="مثال: Security / Maintenance / Contractor"></div>
<div class="field"><label>الصفة</label><select name="affiliation" required><option value="">اختر</option>{% for x in ['مالك','مستأجر','صيف','زائر','شركة','أخرى'] %}<option {{'selected' if data.get('affiliation')==x else ''}}>{{x}}</option>{% endfor %}</select></div>
<div class="field"><label>رقم الموبايل</label><input name="mobile" value="{{data.get('mobile','')}}"></div>
<div class="field"><label>التوقيت</label><input type="time" name="event_time" value="{{data.get('event_time','')}}"></div>
<div class="field"><label>الأولوية</label><select name="priority"><option>Normal</option><option>High</option><option>Urgent</option></select></div>
<div class="field full"><label>بيان الحدث</label><textarea name="event_description" required>{{data.get('event_description','')}}</textarea></div>
<div class="field"><label>مكان الحدث</label><input name="event_location" value="{{data.get('event_location','')}}"></div>
<div class="field"><label>المواصفات / وصف الشخص أو الشيء</label><textarea name="specifications">{{data.get('specifications','')}}</textarea></div>
</div><div class="actions"><button class="btn" type="submit">إرسال الطلب</button><a class="btn gray" href="{{url_for('dashboard')}}">إلغاء</a></div></form></div>{% endblock %}
