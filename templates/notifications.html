{% extends "layout.html" %}{% block title %}الإشعارات{% endblock %}{% block content %}<div class="card"><h1>الإشعارات</h1>{% for n in rows %}<div class="card"><b>{{n.title}}</b><p>{{n.body}}</p><small class="muted">{{n.created_at}}</small>{% if n.request_id %}<div class="actions"><a class="btn gray" href="{{url_for('request_detail',rid=n.request_id)}}">فتح الطلب</a></div>{% endif %}</div>{% else %}<p>لا توجد إشعارات.</p>{% endfor %}</div>{% endblock %}
