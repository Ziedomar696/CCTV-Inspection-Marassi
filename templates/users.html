{% extends 'layout.html' %}{% block title %}المستخدمون{% endblock %}{% block content %}<div class="card"><h1>إدارة المستخدمين</h1><form method="post" action="/users/new" class="form-grid"><div><label>اسم المستخدم</label><input name="username" required></div><div><label>كلمة المرور</label><input name="password" required></div><div><label>الدور</label><select name="role"><option value="security">مشرف الأمن</option><option value="cctv">مراقب CCTV</option><option value="admin">Administration</option></select></div><div class="actions"><button class="btn">إضافة</button></div></form></div><div class="card"><table><tr><th>المستخدم</th><th>الدور</th><th>الحالة</th></tr>{% for u in rows %}<tr><td>{{u.username}}</td><td>{{roles[u.role]}}</td><td>{{'نشط' if u.active else 'غير نشط'}}</td></tr>{% endfor %}</table></div>{% endblock %}
