{% extends "layout.html" %}{% block title %}المستخدمون{% endblock %}{% block content %}<div class="card"><div class="section-head"><div><h1>المستخدمون والصلاحيات</h1><p class="muted">Administration فقط يمكنه إدارة الحسابات.</p></div></div><form method="post" action="{{url_for('users_new')}}" class="grid2"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><div class="field"><label>اسم المستخدم</label><input name="username" required></div><div class="field"><label>كلمة المرور</label><input name="password" minlength="8" required></div><div class="field"><label>الدور</label><select name="role"><option value="security">مشرف الأمن</option><option value="cctv">مراقب CCTV</option><option value="admin">Administration</option></select></div><div class="actions"><button class="btn">إضافة مستخدم</button></div></form></div><div class="card"><table><tr><th>المستخدم</th><th>الدور</th><th>الحالة</th><th>إجراءات</th></tr>{% for u in rows %}<tr><td><b>{{u.username}}</b></td><td>{{roles[u.role]}}</td><td><span class="badge">{{'نشط' if u.active else 'غير نشط'}}</span></td><td class="user-actions"><form method="post" action="{{url_for('user_toggle',uid=u.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="btn gray">{{'تعطيل' if u.active else 'تفعيل'}}</button></form><form method="post" action="{{url_for('user_reset',uid=u.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><input name="password" minlength="8" placeholder="كلمة مرور جديدة" required><button class="btn">تحديث</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
